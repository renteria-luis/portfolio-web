<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary meta ───────────────────────────────────────────────── -->
    <title>Luis Renteria Lezano, AI/ML Engineer</title>

    <!-- max-image-preview:large is what lets Google show the big preview image
         on a result instead of a thumbnail. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />

    <!-- ── Site URL ───────────────────────────────────────────────────── -->
    <link rel="canonical" href="https://luisrenteria.me/" />
    <meta property="og:url" content="https://luisrenteria.me/" />
    <meta property="og:image" content="https://luisrenteria.me/og.jpg" />
    <meta name="twitter:image" content="https://luisrenteria.me/og.jpg" />

    <!-- ── Social preview (LinkedIn / X / Slack / WhatsApp) ────────────── -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:site_name" content="Luis Renteria" />
    <meta property="og:title" content="Luis Renteria Lezano, AI/ML Engineer" />
    <meta property="og:description" content="NLP, RAG systems and MLOps. End-to-end ML pipelines that ship: fraud detection live on Hugging Face, on-device RAG, graph ML for AML." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Terminal window reading: whoami, then Luis Renteria Lezano, AI/ML Engineer and Data Scientist." />
    <meta property="profile:first_name" content="Luis" />
    <meta property="profile:last_name" content="Renteria Lezano" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luis Renteria Lezano, AI/ML Engineer" />
    <meta name="twitter:description" content="NLP, RAG systems and MLOps. End-to-end ML pipelines that ship." />

    <!-- ── Icons ──────────────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Fonts + LCP image ──────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- The headshot is the largest element above the fold; preloading it is the
         cheapest Largest Contentful Paint win available, and LCP feeds ranking. -->
    <link rel="preload" as="image" href="/photo.webp" fetchpriority="high" />

    <!-- ── Theme bootstrap ────────────────────────────────────────────── -->
    <!-- Applies the stored theme before first paint. Without this, a visitor
         who picked light mode gets a dark flash on every page load. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle(
            'dark', localStorage.getItem('theme') !== 'light'
          );
        } catch (e) {}
      })();
    </script>

    <!-- ── Structured data ────────────────────────────────────────────────
         ProfilePage + Person is the combination Google uses to treat a page as
         "this is a person's profile", which is what surfaces a rich result for
         a name query rather than a plain blue link. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "url": "https://luisrenteria.me/",
      "name": "Luis Renteria Lezano, AI/ML Engineer",
      "mainEntity": {
        "@type": "Person",
        "@id": "https://luisrenteria.me/#luis",
        "name": "Luis Renteria Lezano",
        "alternateName": "Luis Renteria",
        "givenName": "Luis",
        "familyName": "Renteria Lezano",
        "url": "https://luisrenteria.me/",
        "image": "https://luisrenteria.me/og.jpg",
        "email": "mailto:luisrenterialezano@gmail.com",
        "jobTitle": "AI/ML Engineer",
        "description": "AI/ML Engineer and Data Scientist specializing in NLP, RAG architectures, MLOps and end-to-end machine learning pipelines.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "London",
          "addressRegion": "ON",
          "addressCountry": "CA"
        },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Fanshawe College" },
          { "@type": "CollegeOrUniversity", "name": "Catholic University of San Pablo (UCSP)" }
        ],
        "knowsAbout": [
          "Machine Learning", "Natural Language Processing",
          "Retrieval-Augmented Generation", "MLOps", "Deep Learning",
          "Graph Neural Networks", "Data Engineering", "Vector Search"
        ],
        "knowsLanguage": ["en", "es"],
        "seeks": {
          "@type": "Demand",
          "name": "Machine Learning / Data co-op placement, Fall 2026"
        },
        "sameAs": [
          "https://github.com/renteria-luis",
          "https://linkedin.com/in/renteria-luis",
          "https://huggingface.co/renteria-luis",
          "https://www.datacamp.com/portfolio/luisrenterialezano",
          "https://www.kaggle.com/luisrenterialezano"
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
